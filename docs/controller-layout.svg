<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Segoe UI, Arial, sans-serif">
  <title>Suggested physical layout: one 4-button pad per player, both wired to one ESP32 box</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="32" font-size="20" font-weight="700" text-anchor="middle" fill="#1b2233">Suggested layout: one pad per player, one ESP32 box</text>

  <!-- pad template: player 1 -->
  <g transform="translate(40,70)">
    <rect width="300" height="150" rx="40" fill="#1f3b73" stroke="#0e1f40" stroke-width="3"/>
    <text x="150" y="-10" font-size="15" font-weight="700" text-anchor="middle" fill="#b36b00">PLAYER 1</text>
    <circle cx="62" cy="80" r="28" fill="#0a1a3d" stroke="#fff" stroke-width="3"/><text x="62" y="86" font-size="18" text-anchor="middle" fill="#fff">◀</text>
    <circle cx="128" cy="80" r="28" fill="#0a1a3d" stroke="#fff" stroke-width="3"/><text x="128" y="86" font-size="18" text-anchor="middle" fill="#fff">▶</text>
    <circle cx="196" cy="104" r="28" fill="#b02a35" stroke="#fff" stroke-width="3"/><text x="196" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">BRAKE</text>
    <circle cx="250" cy="56" r="28" fill="#2e8a4a" stroke="#fff" stroke-width="3"/><text x="250" y="62" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">GAS</text>
    <text x="95" y="140" font-size="12" text-anchor="middle" fill="#cfe0ff">left thumb</text>
    <text x="223" y="146" font-size="12" text-anchor="middle" fill="#cfe0ff">right thumb</text>
  </g>

  <!-- pad: player 2 -->
  <g transform="translate(560,70)">
    <rect width="300" height="150" rx="40" fill="#1f3b73" stroke="#0e1f40" stroke-width="3"/>
    <text x="150" y="-10" font-size="15" font-weight="700" text-anchor="middle" fill="#1d63a8">PLAYER 2</text>
    <circle cx="62" cy="80" r="28" fill="#0a1a3d" stroke="#fff" stroke-width="3"/><text x="62" y="86" font-size="18" text-anchor="middle" fill="#fff">◀</text>
    <circle cx="128" cy="80" r="28" fill="#0a1a3d" stroke="#fff" stroke-width="3"/><text x="128" y="86" font-size="18" text-anchor="middle" fill="#fff">▶</text>
    <circle cx="196" cy="104" r="28" fill="#b02a35" stroke="#fff" stroke-width="3"/><text x="196" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">BRAKE</text>
    <circle cx="250" cy="56" r="28" fill="#2e8a4a" stroke="#fff" stroke-width="3"/><text x="250" y="62" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">GAS</text>
    <text x="95" y="140" font-size="12" text-anchor="middle" fill="#cfe0ff">left thumb</text>
    <text x="223" y="146" font-size="12" text-anchor="middle" fill="#cfe0ff">right thumb</text>
  </g>

  <!-- ESP32 box -->
  <rect x="370" y="250" width="160" height="80" rx="10" fill="#e9edf3" stroke="#8a919c" stroke-width="2"/>
  <text x="450" y="283" font-size="16" font-weight="700" text-anchor="middle" fill="#1b2233">ESP32 box</text>
  <text x="450" y="304" font-size="12" text-anchor="middle" fill="#1b2233">USB to PC or power bank</text>

  <!-- cables: 5 wires each (4 signals + GND) -->
  <path d="M190 220 C 190 290, 300 290, 370 290" fill="none" stroke="#e08a00" stroke-width="6"/>
  <path d="M710 220 C 710 290, 600 290, 530 290" fill="none" stroke="#2a86d8" stroke-width="6"/>
  <text x="230" y="318" font-size="12" fill="#1b2233">5 wires: 4 signals + GND</text>
  <text x="560" y="318" font-size="12" fill="#1b2233">5 wires: 4 signals + GND</text>

  <text x="450" y="365" font-size="13" text-anchor="middle" fill="#1b2233">Drift: at speed press BRAKE + LEFT/RIGHT, then hold GAS + steering · Countersteer to regain grip</text>
</svg>
